name: Build A11y Dummy APK
on:
  workflow_dispatch:
  push:
    branches: [a11y-dummy-automation]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - run: gradle assembleDebug --stacktrace 2>&1 | tee build-log.txt; exit ${PIPESTATUS[0]}
        shell: bash
      - if: failure()
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git add -f build-log.txt && git commit -m "CI build log [skip ci]" && git push
      - uses: actions/upload-artifact@v4
        with:
          name: a11y-dummy-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete a11y-latest --yes --cleanup-tag || true
          gh release create a11y-latest app/build/outputs/apk/debug/app-debug.apk#A11yDummyAutomation-debug.apk --target "$GITHUB_SHA" --title "A11y Dummy APK (debug)" --notes "Debug build from $GITHUB_SHA" --prerelease
